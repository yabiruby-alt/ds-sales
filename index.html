<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>매출 현황</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --ink:#1a1d23; --muted:#6b7280; --line:#e5e7eb; --accent:#1c69d4; --err:#c62828; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --card:#181b21; --ink:#e8eaed; --muted:#9aa0a6; --line:#2a2f37; --accent:#5b9bf0; --err:#ef6b6b; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
         font-family:-apple-system, "Pretendard", "Malgun Gothic", sans-serif; padding:16px; }
  form { width:100%; max-width:340px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px 24px; }
  h1 { font-size:18px; margin:0 0 4px; }
  p { margin:0 0 20px; color:var(--muted); font-size:13px; }
  input[type=password] { width:100%; font-size:16px; padding:11px 12px; border:1px solid var(--line); border-radius:8px;
         background:var(--bg); color:var(--ink); }
  label { display:flex; gap:6px; align-items:center; margin:12px 0 18px; font-size:13px; color:var(--muted); }
  button { width:100%; padding:11px; font-size:15px; font-weight:600; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.6; }
  #err { color:var(--err); font-size:13px; min-height:18px; margin-top:10px; }
</style>
</head>

  <div id="err"></div>
</form>

const KEY_NAME = "sales_key_" + P.salt;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const toB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));

async function deriveKey(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const hex = P.salt.match(/../g).map(h => parseInt(h, 16));
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: new Uint8Array(hex), iterations: P.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
async function decrypt(key) {
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.iv) }, key, b64(P.ct));
  return new TextDecoder().decode(plain);
}
function show(html) {
  // 로딩 중에 document.open()을 부르면 무시되고 기존 문서 뒤에 덧붙여지므로, 로드가 끝난 뒤에 교체
  const swap = () => { document.open(); document.write(html); document.close(); };
  if (document.readyState === "complete") swap(); else addEventListener("load", swap, { once: true });
}
(async () => {
  let saved = null;
  try { saved = localStorage.getItem(KEY_NAME); } catch (e) {}
  if (!saved) return;
  try {
    const key = await crypto.subtle.importKey("raw", b64(saved), "AES-GCM", false, ["decrypt"]);
    show(await decrypt(key));
  } catch (e) { try { localStorage.removeItem(KEY_NAME); } catch (_) {} }
})();
document.getElementById("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const btn = document.getElementById("btn"), err = document.getElementById("err");
  btn.disabled = true; err.textContent = "";
  try {
    const key = await deriveKey(document.getElementById("pw").value);
    const html = await decrypt(key);  // 비밀번호가 틀리면 여기서 예외 → 잘못된 키는 저장되지 않음
    if (document.getElementById("remember").checked) {
      try { localStorage.setItem(KEY_NAME, toB64(await crypto.subtle.exportKey("raw", key))); } catch (e) {}
    }
    show(html);
  } catch (e) {
    err.textContent = "비밀번호가 맞지 않습니다.";
    btn.disabled = false;
  }
});
</script>
